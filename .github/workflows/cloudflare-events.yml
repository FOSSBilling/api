name: Cloudflare Events

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@e3ee2193da5d71cc74526caaff893346cad02eda # main
    with:
      operation: sync-pr-comment
      build-workflow: ci.yml
      pr-base-branch: main
      worker-name: api
