name: Cloudflare Events

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    uses: FOSSBilling/.workflows/.github/workflows/cloudflare-workers.yml@ac7148138a750dd1298dadb50a263b97e4a0ff0f
    with:
      operation: sync-pr-comment
      build-workflow: ci.yml
      pr-base-branch: main
      worker-name: api
