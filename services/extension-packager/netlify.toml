[build]
  publish = "services/extension-packager/netlify/public"

[build.environment]
  # Lambda Node 26 is currently public preview; application CI uses Node 26.
  NODE_VERSION = "24"

[functions]
  directory = "services/extension-packager/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["sharp", "@zeropress/svg-hush"]
