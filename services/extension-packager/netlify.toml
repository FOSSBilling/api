# GitHub Actions compiles this service offline; the CLI packages and deploys it.
# Context-specific runtime credentials belong in Netlify's environment settings.
[build]
  command = "npm run build:netlify --workspace @fossbilling/extension-packager"
  publish = "services/extension-packager/netlify/public"

[build.environment]
  # Lambda Node 26 is currently public preview; application CI uses Node 26.
  NODE_VERSION = "24"

[functions]
  directory = "services/extension-packager/.netlify/functions-source"
  external_node_modules = ["sharp", "@zeropress/svg-hush"]
